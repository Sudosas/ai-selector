<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AI Selector - Mini App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --dark: #242D3C;
            --accent: #D7B18F;
            --text: #546573;
            --light: #8DA0A8;
            --bg-gradient: linear-gradient(135deg, #242D3C 0%, #2a3447 100%);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            color: var(--text);
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            animation: slideDown 0.6s ease-out;
        }

        .header h1 {
            font-size: 2rem;
            color: var(--accent);
            margin-bottom: 5px;
            font-weight: 700;
        }

        .header p {
            font-size: 0.9rem;
            color: var(--light);
            font-weight: 300;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.02) 100%);
            border: 2px solid rgba(215, 177, 143, 0.2);
            border-radius: 12px;
            padding: 20px 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            animation: fadeInUp 0.5s ease-out forwards;
            opacity: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 140px;
            justify-content: center;
        }

        .card:nth-child(1) { animation-delay: 0.1s; }
        .card:nth-child(2) { animation-delay: 0.15s; }
        .card:nth-child(3) { animation-delay: 0.2s; }
        .card:nth-child(4) { animation-delay: 0.25s; }
        .card:nth-child(5) { animation-delay: 0.3s; }
        .card:nth-child(6) { animation-delay: 0.35s; }
        .card:nth-child(7) { animation-delay: 0.4s; }
        .card:nth-child(8) { animation-delay: 0.45s; }

        .card:hover {
            border-color: var(--accent);
            background: linear-gradient(135deg, rgba(215, 177, 143, 0.15) 0%, rgba(215, 177, 143, 0.05) 100%);
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(215, 177, 143, 0.15);
        }

        .card-icon {
            font-size: 2.2rem;
            display: inline-block;
            transition: transform 0.3s ease;
        }

        .card:hover .card-icon {
            transform: scale(1.15);
        }

        .card-title {
            font-size: 1.1rem;
            color: var(--accent);
            font-weight: 600;
        }

        .card-description {
            font-size: 0.75rem;
            color: var(--light);
            line-height: 1.3;
        }

        .card-link {
            display: inline-block;
            background: linear-gradient(135deg, var(--accent) 0%, #c89a7c 100%);
            color: var(--dark);
            padding: 7px 18px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s ease;
            border: none;
            cursor: pointer;
            font-size: 0.8rem;
            margin-top: auto;
        }

        .card-link:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 15px rgba(215, 177, 143, 0.25);
        }

        .card-link:active {
            transform: scale(0.95);
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .footer {
            text-align: center;
            color: var(--light);
            font-size: 0.8rem;
            opacity: 0.7;
        }

        @media (max-width: 380px) {
            .header h1 {
                font-size: 1.6rem;
            }

            .card {
                padding: 15px 10px;
                min-height: 130px;
            }

            .card-icon {
                font-size: 2rem;
            }

            .card-title {
                font-size: 1rem;
            }

            .card-description {
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 AI Selector</h1>
            <p>Вибери нейронку</p>
        </div>

        <div class="grid">
            <div class="card">
                <div class="card-icon">🔷</div>
                <div class="card-title">ChatGPT</div>
                <div class="card-description">OpenAI</div>
                <a href="https://chat.openai.com" target="_blank" class="card-link">Відкрити</a>
            </div>

            <div class="card">
                <div class="card-icon">🤖</div>
                <div class="card-title">Claude</div>
                <div class="card-description">Anthropic</div>
                <a href="https://claude.ai" target="_blank" class="card-link">Відкрити</a>
            </div>

            <div class="card">
                <div class="card-icon">✨</div>
                <div class="card-title">Gemini</div>
                <div class="card-description">Google</div>
                <a href="https://gemini.google.com" target="_blank" class="card-link">Відкрити</a>
            </div>

            <div class="card">
                <div class="card-icon">🚀</div>
                <div class="card-title">DeepSeek</div>
                <div class="card-description">Китайська AI</div>
                <a href="https://www.deepseek.com" target="_blank" class="card-link">Відкрити</a>
            </div>

            <div class="card">
                <div class="card-icon">🔮</div>
                <div class="card-title">Copilot</div>
                <div class="card-description">Microsoft</div>
                <a href="https://copilot.microsoft.com" target="_blank" class="card-link">Відкрити</a>
            </div>

            <div class="card">
                <div class="card-icon">🧠</div>
                <div class="card-title">Perplexity</div>
                <div class="card-description">Пошук</div>
                <a href="https://www.perplexity.ai" target="_blank" class="card-link">Відкрити</a>
            </div>

            <div class="card">
                <div class="card-icon">⚡</div>
                <div class="card-title">Llama 2</div>
                <div class="card-description">Meta</div>
                <a href="https://www.llama2.ai" target="_blank" class="card-link">Відкрити</a>
            </div>

            <div class="card">
                <div class="card-icon">🎨</div>
                <div class="card-title">Grok</div>
                <div class="card-description">xAI</div>
                <a href="https://grok.x.com" target="_blank" class="card-link">Відкрити</a>
            </div>
        </div>

        <div class="footer">
            <p>© 2024 AI Selector Mini App 🚀</p>
        </div>
    </div>
</body>
</html>
